<p>
    رفع القاضي عينيه ببطء،
    ثم نظر مباشرة إلى الطفل.
</p>

<p>
    لم يتحدث أحد طوال تلك اللحظات،
    وكأن الجميع كان ينتظر الكلمات التي ستخرج
    من فم الرجل العجوز.
</p>

<p>
    أخيرًا، وضع القاضي يده على الطاولة.
    وانعكس صوت الضربة الخفيفة في أنحاء القاعة.
</p>

<p>
    عندها بدأ الكلام.
</p>
